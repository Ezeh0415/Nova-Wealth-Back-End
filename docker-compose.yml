services:
  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: althworld-backend
    environment:
      - NODE_ENV=development
      - PORT=8080
    ports:
      - "8080:8080"
    networks:
      - althworld-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - .:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    command: nodemon -L App.js

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: althworld-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - althworld-network
    depends_on:
      - app
    restart: unless-stopped

networks:
  althworld-network:
    driver: bridge

